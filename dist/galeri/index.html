    <main>

    <div class="card-grid gallery-grid">
                    <button type="button" class="card album-card" data-album="momen-musik" style="--i: 0">

                <span class="album-info">
                    <strong>Momen Musik</strong>
                    <small>3 foto</small>
                </span>
            </button>
                    <button type="button" class="card album-card" data-album="Picture of moments" style="--i: 1">

            </button>

                    <small>3 foto</small>
                </span>
            </button>
                    <button type="button" class="card album-card" data-album="Random Pic" style="--i: 3">

</section>

                                    <figure class="slide">

                    </figure>
                                    <figure class="slide">
                        <img src="http://vitoprofil.netlify.app/images/galeri/foto2.jpg" alt="Piano &amp; Keyboard" draggable="false">
                        <figcaption>Piano &amp; Keyboard</figcaption>
                    </figure>
                                    <figure class="slide">
                        <img src="http://vitoprofil.netlify.app/images/galeri/foto3.jpg" alt="My band" draggable="false">
                        <figcaption>My band</figcaption>
                    </figure>
                            </div>
            <button type="button" class="s-btn prev" aria-label="Foto sebelumnya">&lsaquo;</button>
            <button type="button" class="s-btn next" aria-label="Foto berikutnya">&rsaquo;</button>
        </div>
        <div class="dots">
